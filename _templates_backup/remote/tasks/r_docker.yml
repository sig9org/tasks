tasks:
  check:
    internal: true
    cmds:
      - docker ps -a --filter "health=unhealthy"

  ps:
    internal: true
    cmds:
      - 'docker ps --format "table {{"{{"}}.ID{{"}}"}}\t{{"{{"}}.Image{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}\t{{"{{"}}.Names{{"}}"}}"'

  restart:
    internal: true
    cmds:
      - docker restart $(docker ps -a --filter "health=unhealthy" -q)
