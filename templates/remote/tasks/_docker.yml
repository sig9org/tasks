tasks:
  buildx-version:
    internal: true
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 --output=type=registry --tag {{.DOCKER_REPO}}:latest --tag {{.DOCKER_REPO}}:{{.DOCKER_VERSION}} versions/{{.DOCKER_VERSION}}/

  check:
    internal: true
    cmds:
      - docker ps -a --filter "health=unhealthy"

  ps:
    internal: true
    cmds:
      - 'docker ps --format "table {{"{{"}}.ID{{"}}"}}\t{{"{{"}}.Image{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}\t{{"{{"}}.Names{{"}}"}}"'

  restart:
    internal: true
    cmds:
      - docker restart $(docker ps -a --filter "health=unhealthy" -q)
