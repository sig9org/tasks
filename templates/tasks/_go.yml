tasks:
  all-build:
    internal: true
    cmds:
      - task: clean
      - |
        set -e
        for target in {{.PLATFORMS}}; do
          goos="${target%/*}"
          goarch="${target#*/}"
          ext=""
          if [ "$goos" = "windows" ]; then ext=".exe"; fi
          out="{{.DIST_DIR}}/{{.BINARY_NAME}}_{{.RELEASE_VERSION}}_${goos}_${goarch}${ext}"
          echo "building ${out}"
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -ldflags "-X {{.VERSION_PKG}}.Version={{.RELEASE_VERSION}}" -o "$out" .
        done

  build:
    internal: true
    cmds:
      - task: clean
      - go build -ldflags "-X {{.VERSION_PKG}}.Version={{.VERSION}}" -o {{.DIST_DIR}}/{{.BINARY_NAME}}{{if eq OS "windows"}}.exe{{end}} .

  clean:
    internal: true
    cmds:
      - rm -rfv {{.DIST_DIR}}/*
      - mkdir -p {{.DIST_DIR}}

  test:
    internal: true
    cmds:
      - go vet ./...
      - go test ./...
