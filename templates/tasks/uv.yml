tasks:
  uv-freeze:
    aliases: [uf]
    deps: [_time:start]
    desc: "Export installed packages"
    cmds:
      - defer: { task: _time:end }
      - task: _uv:freeze

  uv-sync:
    aliases: [us]
    deps: [_time:start]
    desc: "Sync dependencies and upgrade all packages"
    cmds:
      - defer: { task: _time:end }
      - task: _uv:sync
