tasks:
  cleanup:
    aliases: [c]
    desc: "Cleanup unnecessary files"
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: cleanup:shell
      - task: cleanup:win
      - task: cleanup:refresh

  cleanup:shell:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    platforms: [darwin, linux]
    cmds:
      - for: { var: CLEANUP_DIRS }
        cmd: find . -type d -name "{{.ITEM}}" -print -prune -exec rm -rf {} + | sed 's/^/[DELETE]/'
      - for: { var: CLEANUP_FILES }
        cmd: find . -name "{{.ITEM}}" -print -delete | sed 's/^/[DELETE]/'

  cleanup:win:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    platforms: [windows]
    cmds:
      - for: { var: CLEANUP_DIRS }
        cmd: powershell -NoProfile -Command "Get-ChildItem -Path . -Recurse -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq '{{.ITEM}}' } | Sort-Object FullName -Descending | ForEach-Object { Write-Output ('[DELETE]' + $_.FullName); Remove-Item -LiteralPath $_.FullName -Recurse -Force }"
      - for: { var: CLEANUP_FILES }
        cmd: powershell -NoProfile -Command "Get-ChildItem -Path . -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq '{{.ITEM}}' } | ForEach-Object { Write-Output ('[DELETE]' + $_.FullName); Remove-Item -LiteralPath $_.FullName -Force }"

  cleanup:refresh:
    internal: true
    dir: "{{.ROOT_DIR}}"
    env:
      TASK_X_REMOTE_TASKFILES: 1
    cmds:
      - task --yes --download --force --list-all > /dev/null 2>&1
