tasks:
  go-build:
    aliases: [gb]
    desc: 'Build a binary for the current platform'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - defer:
          task: notify
          vars:
            NOTIFY_TITLE: 'Go Build'
            NOTIFY_BODY: 'Done.'
      - task: go-clean
      - echo "Building binary for {{OS}}/{{ARCH}}..."
      - go build -ldflags "-X {{.VERSION_PKG}}.Version={{.VERSION}}" -o {{.DIST_DIR}}/{{.BINARY_NAME}}{{if eq OS "windows"}}.exe{{end}} .

  go-build-all:
    aliases: [gba]
    desc: 'Cross-compile release binaries for all platforms'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - defer:
          task: notify
          vars:
            NOTIFY_TITLE: 'Go Build All'
            NOTIFY_BODY: 'Done.'
      - task: go-clean
      - |
        set -e
        for target in {{.PLATFORMS}}; do
          goos="${target%/*}"
          goarch="${target#*/}"
          ext=""
          if [ "$goos" = "windows" ]; then ext=".exe"; fi
          out="{{.DIST_DIR}}/{{.BINARY_NAME}}_{{.RELEASE_VERSION}}_${goos}_${goarch}${ext}"
          echo "building ${out}"
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -ldflags "-X {{.VERSION_PKG}}.Version={{.RELEASE_VERSION}}" -o "$out" .
        done

  go-clean:
    aliases: [gc]
    desc: 'Delete the contents of the distribution directory'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - rm -rfv {{.DIST_DIR}}/*
      - mkdir -p {{.DIST_DIR}}

  go-register:
    desc: 'Register the latest tagged version on pkg.go.dev'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - |
        set -e
        version=$(git describe --tags --abbrev=0)
        echo "registering {{.MODULE}}@${version} on pkg.go.dev"
        curl -fsS "https://proxy.golang.org/{{.MODULE}}/@v/${version}.info"
        echo
        curl -fsS -o /dev/null "https://pkg.go.dev/{{.MODULE}}@${version}"
        echo "requested indexing of {{.MODULE}}@${version}"

  go-run:
    aliases: [gr]
    desc: 'Run the application'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - go run . {{.CLI_ARGS}}

  go-scan:
    aliases: [gs]
    desc: 'Scan the application'
    ignore_error: true
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - |
        GREEN='\033[0;32m'
        RESET='\033[0m'
        printf '%b======================================== govulncheck%b\n' "$GREEN" "$RESET"
      - govulncheck ./...
      - |
        GREEN='\033[0;32m'
        RESET='\033[0m'
        printf '%b======================================== OSV-Scanner%b\n' "$GREEN" "$RESET"
      - osv-scanner -r .

  go-test:
    aliases: [gt]
    desc: 'Run the Go test suite'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - go vet ./...
      - go test ./...

  go-version:
    aliases: [gv]
    desc: 'Show version information'
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - go run -ldflags "-X {{.VERSION_PKG}}.Version={{.VERSION}}" . -v
