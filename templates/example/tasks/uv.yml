tasks:
  uv-freeze:
    aliases: [uf]
    desc: "Export installed packages"
    cmds:
      - defer:
          task: _task:_time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _uv:freeze

  uv-sync:
    aliases: [us]
    desc: "Sync dependencies and upgrade all packages"
    cmds:
      - defer:
          task: _task:_time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _uv:sync
