# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  CLEANUP_DIRS:
    - .idea
    - .terraform
    - .vscode
  CLEANUP_FILES:
    - .DS_Store
    - .terraform.lock.hcl
    - terraform.tfstate
    - terraform.tfstate.backup
    - Desktop.ini
    - Thumbs.db

tasks:
  refresh:
    internal: true
    dir: "{{.ROOT_DIR}}"
    env:
      TASK_X_REMOTE_TASKFILES: 1
    cmds:
      - task --yes --download --force --list-all > /dev/null 2>&1

  shell:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    platforms: [darwin, linux]
    cmds:
      - for: { var: CLEANUP_DIRS }
        cmd: find . -type d -name "{{.ITEM}}" -print -prune -exec rm -rf {} + | sed 's/^/[DELETE]/'
      - for: { var: CLEANUP_FILES }
        cmd: find . -name "{{.ITEM}}" -print -delete | sed 's/^/[DELETE]/'

  start:
    internal: true
    cmds:
      - task: shell
      - task: refresh
