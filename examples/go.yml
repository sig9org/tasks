# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: ['project.ini']

silent: true

includes:
  _go: https://raw.githubusercontent.com/sig9org/tasks/main/tasks/_go.yml
  _time: https://raw.githubusercontent.com/sig9org/tasks/main/tasks/_time.yml

tasks:
  default:
    cmds:
      - task --list

  go-all-build:
    aliases: [ga]
    deps: [_time:start]
    desc: "Cross-compile release binaries for all platforms"
    cmds:
      - task: _go:all-build
      - defer: { task: _time:end }

  go-build:
    aliases: [gb]
    deps: [_time:start]
    desc: "Build a binary for the current platform"
    cmds:
      - task: _go:build
      - defer: { task: _time:end }

  go-clean:
    aliases: [gc]
    deps: [_time:start]
    desc: "Delete the contents of the distribution directory"
    cmds:
      - task: _go:clean
      - defer: { task: _time:end }

  go-test:
    aliases: [gt]
    deps: [_time:start]
    desc: "Run the Go test suite"
    cmds:
      - task: _go:test
      - defer: { task: _time:end }
