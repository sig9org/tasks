# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: ['.env']

silent: true

vars:
  CLEANUP_DIRS:
    - .idea
    - .terraform
    - .vscode
  CLEANUP_FILES:
    - .DS_Store
    - .terraform.lock.hcl
    - terraform.tfstate
    - terraform.tfstate.backup
    - Desktop.ini
    - Thumbs.db
  START_TIME: '{{now.UnixMilli}}'

tasks:
  default:
    cmds:
      - task --list

  _cleanup:start:
    internal: true
    cmds:
      - task: _cleanup:shell
      - task: _cleanup:refresh

  _cleanup:shell:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    platforms: [darwin, linux]
    cmds:
      - for: { var: CLEANUP_DIRS }
        cmd: find . -type d -name "{{.ITEM}}" -print -prune -exec rm -rf {} +
      - for: { var: CLEANUP_FILES }
        cmd: find . -name "{{.ITEM}}" -print -delete

  _cleanup:refresh:
    internal: true
    dir: "{{.ROOT_DIR}}"
    env:
      TASK_X_REMOTE_TASKFILES: 1
    cmds:
      - task --yes --download --force --list-all > /dev/null 2>&1

  _time:end:
    internal: true
    vars:
      END_TIME: '{{now.UnixMilli}}'
    cmds:
      - |
        ELAPSED_MS=$(({{.END_TIME}} - {{.START_TIME}}))
        MINUTES=$((ELAPSED_MS / 60000))
        SECONDS=$((ELAPSED_MS % 60000 / 1000))
        MILLIS=$((ELAPSED_MS % 1000))
        GREEN='\033[0;32m'
        RESET='\033[0m'
        if [ "$MINUTES" -gt 0 ]; then
          printf '%b======================================== Elapsed: %s min %s sec %s msec%b\n' "$GREEN" "$MINUTES" "$SECONDS" "$MILLIS" "$RESET"
        elif [ "$SECONDS" -gt 0 ]; then
          printf '%b======================================== Elapsed: %s sec %s msec%b\n' "$GREEN" "$SECONDS" "$MILLIS" "$RESET"
        else
          printf '%b======================================== Elapsed: %s msec%b\n' "$GREEN" "$MILLIS" "$RESET"
        fi

  cleanup:
    aliases: [c]
    desc: "Cleanup unnecessary files"
    cmds:
      - defer:
          task: _time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _cleanup:start
