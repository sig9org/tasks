# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: ['.env']

silent: true

vars:
  CLEANUP_DIRS:
    - .idea
    - .terraform
    - .vscode
  CLEANUP_FILES:
    - .DS_Store
    - .terraform.lock.hcl
    - terraform.tfstate
    - terraform.tfstate.backup
    - Desktop.ini
    - Thumbs.db
  DETECTED_OS:
    sh: echo {{OS}}
  LINUX_DISTRO:
    sh: |
      if [ -f /etc/os-release ]; then
        . /etc/os-release
        echo "$ID"
      else
        echo "unknown"
      fi
  START_TIME: '{{now.UnixMilli}}'

tasks:
  default:
    cmds:
      - task --list

  cleanup:
    aliases: [c]
    desc: "Cleanup unnecessary files"
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: cleanup:shell
      - task: cleanup:win
      - task: cleanup:refresh

  cleanup:shell:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    platforms: [darwin, linux]
    cmds:
      - for: { var: CLEANUP_DIRS }
        cmd: find . -type d -name "{{.ITEM}}" -print -prune -exec rm -rf {} + | sed 's/^/[DELETE]/'
      - for: { var: CLEANUP_FILES }
        cmd: find . -name "{{.ITEM}}" -print -delete | sed 's/^/[DELETE]/'

  cleanup:win:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    platforms: [windows]
    cmds:
      - for: { var: CLEANUP_DIRS }
        cmd: powershell -NoProfile -Command "Get-ChildItem -Path . -Recurse -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq '{{.ITEM}}' } | Sort-Object FullName -Descending | ForEach-Object { Write-Output ('[DELETE]' + $_.FullName); Remove-Item -LiteralPath $_.FullName -Recurse -Force }"
      - for: { var: CLEANUP_FILES }
        cmd: powershell -NoProfile -Command "Get-ChildItem -Path . -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq '{{.ITEM}}' } | ForEach-Object { Write-Output ('[DELETE]' + $_.FullName); Remove-Item -LiteralPath $_.FullName -Force }"

  cleanup:refresh:
    internal: true
    dir: "{{.ROOT_DIR}}"
    env:
      TASK_X_REMOTE_TASKFILES: 1
    cmds:
      - task --yes --download --force --list-all > /dev/null 2>&1

  notify:
    internal: true
    cmds:
      - task: notify:mac
        vars:
          NOTIFY_TITLE: '{{.NOTIFY_TITLE}}'
          NOTIFY_BODY: '{{.NOTIFY_BODY}}'
      - task: notify:win
        vars:
          NOTIFY_TITLE: '{{.NOTIFY_TITLE}}'
          NOTIFY_BODY: '{{.NOTIFY_BODY}}'

  notify:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - osascript -e 'display notification "{{.NOTIFY_BODY}}" with title "{{.NOTIFY_TITLE}}"'
      - /bin/sh -c 'nohup /usr/bin/afplay /System/Library/Sounds/Glass.aiff >/dev/null 2>&1 < /dev/null &'

  notify:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -Command "[System.Media.SystemSounds]::Beep.Play(); $notify = New-Object System.Windows.Forms.NotifyIcon; $notify.Icon = [System.Drawing.SystemIcons]::Information; $notify.BalloonTipTitle = '{{.NOTIFY_TITLE}}'; $notify.BalloonTipText = '{{.NOTIFY_BODY}}'; $notify.Visible = $true; $notify.ShowBalloonTip(5000); Start-Sleep -Seconds 5; $notify.Dispose()"

  os-check-update:
    aliases: [oc]
    desc: "Check for available OS package updates"
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - defer:
          task: notify
          vars:
            NOTIFY_TITLE: "Check OS Update"
            NOTIFY_BODY: "Done."
      - task: os-check-update:amazon-linux
      - task: os-check-update:macos
      - task: os-check-update:ubuntu

  os-check-update:amazon-linux:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "linux" ] || [ "{{.LINUX_DISTRO}}" != "amzn" ]'
    cmds:
      - echo "Checking for Amazon Linux 2023 package updates..."
      - |
        rc=0
        output=$(sudo dnf check-update 2>&1) || rc=$?
        echo "$output"
        if [ "$rc" -eq 100 ]; then
          echo "----------------------------------------"
          echo "Updates are available (see the list above)."
        elif [ "$rc" -eq 0 ]; then
          echo "No updates available. System is up to date."
        else
          echo "Failed to check updates (exit code: $rc)."
        fi

  os-check-update:macos:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "darwin" ]'
    cmds:
      - echo "Checking for macOS Homebrew package updates..."
      - brew update
      - |
        outdated=$(brew outdated --verbose)
        if [ -n "$outdated" ]; then
          echo "The following package(s) can be updated:"
          echo "$outdated"
        else
          echo "No updates available. System is up to date."
        fi

  os-check-update:ubuntu:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "linux" ] || [ "{{.LINUX_DISTRO}}" != "ubuntu" ]'
    cmds:
      - echo "Checking for Ubuntu package updates..."
      - |
        rc=0
        output=$(sudo apt-get update -qq 2>&1) || rc=$?
        echo "$output"
        if [ "$rc" -ne 0 ]; then
          echo "----------------------------------------"
          echo "Warning: failed to refresh some package lists (exit code: $rc)."
        fi
        upgradable=$(apt list --upgradable 2>/dev/null | grep -v '^Listing' || true)
        if [ -n "$upgradable" ]; then
          echo "The following package(s) can be updated:"
          echo "$upgradable"
        else
          echo "No updates available. System is up to date."
        fi

  os-remove:
    aliases: [or]
    desc: "Remove unnecessary OS packages and dependencies"
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - defer:
          task: notify
          vars:
            NOTIFY_TITLE: "Remove OS Cache"
            NOTIFY_BODY: "Done."
      - task: os-remove:amazon-linux
      - task: os-remove:macos
      - task: os-remove:ubuntu

  os-remove:amazon-linux:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "linux" ] || [ "{{.LINUX_DISTRO}}" != "amzn" ]'
    cmds:
      - echo "Removing unnecessary packages and cache (Amazon Linux)..."
      - sudo dnf autoremove -y
      - sudo dnf clean all

  os-remove:macos:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "darwin" ]'
    cmds:
      - echo "Removing Homebrew cache and old versions..."
      - brew cleanup

  os-remove:ubuntu:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "linux" ] || [ "{{.LINUX_DISTRO}}" != "ubuntu" ]'
    cmds:
      - echo "Removing unnecessary packages and cache (Ubuntu)..."
      - sudo apt-get autoremove -y
      - sudo apt-get clean

  os-update:
    aliases: [ou]
    desc: "Update and upgrade OS packages"
    cmds:
      - defer:
          task: time
          vars:
            START_TIME: '{{.START_TIME}}'
      - defer:
          task: notify
          vars:
            NOTIFY_TITLE: "OS Update"
            NOTIFY_BODY: "Done."
      - task: os-update:amazon-linux
      - task: os-update:macos
      - task: os-update:ubuntu

  os-update:amazon-linux:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "linux" ] || [ "{{.LINUX_DISTRO}}" != "amzn" ]'
    cmds:
      - echo "Running Amazon Linux system update..."
      - |
        rc=0
        output=$(sudo dnf check-update 2>&1) || rc=$?
        new_release=$(echo "$output" | sed -n 's/.*--releasever=\([0-9][0-9.]*\).*/\1/p' | head -n1)
        if [ -n "$new_release" ]; then
          echo "A newer release of Amazon Linux ($new_release) is available. Upgrading..."
          sudo dnf upgrade --releasever="$new_release" -y
        else
          sudo dnf update --releasever=latest -y
        fi
      - |
        if [ -f /opt/gitlab/embedded/service/gitlab-shell/bin/gitlab-sshd ]; then
          sudo setcap 'cap_net_bind_service=+ep' /opt/gitlab/embedded/service/gitlab-shell/bin/gitlab-sshd
        fi

  os-update:macos:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "darwin" ]'
    cmds:
      - echo "Running macOS Homebrew update..."
      - brew update
      - brew upgrade -y

  os-update:ubuntu:
    internal: true
    status:
      - '[ "{{.DETECTED_OS}}" != "linux" ] || [ "{{.LINUX_DISTRO}}" != "ubuntu" ]'
    cmds:
      - echo "Running Ubuntu system update..."
      - |
        rc=0
        output=$(sudo apt-get update 2>&1) || rc=$?
        echo "$output"
        if [ "$rc" -ne 0 ]; then
          echo "Warning: failed to refresh some package lists (exit code: $rc). Continuing with upgrade using cached lists."
        fi
      - sudo apt-get upgrade -y

  time:
    internal: true
    vars:
      END_TIME: '{{now.UnixMilli}}'
    cmds:
      - |
        ELAPSED_MS=$(({{.END_TIME}} - {{.START_TIME}}))
        MINUTES=$((ELAPSED_MS / 60000))
        SECONDS=$((ELAPSED_MS % 60000 / 1000))
        MILLIS=$((ELAPSED_MS % 1000))
        GREEN='\033[0;32m'
        RESET='\033[0m'
        if [ "$MINUTES" -gt 0 ]; then
          printf '%b======================================== Elapsed: %s min %s sec %s msec%b\n' "$GREEN" "$MINUTES" "$SECONDS" "$MILLIS" "$RESET"
        elif [ "$SECONDS" -gt 0 ]; then
          printf '%b======================================== Elapsed: %s sec %s msec%b\n' "$GREEN" "$SECONDS" "$MILLIS" "$RESET"
        else
          printf '%b======================================== Elapsed: %s msec%b\n' "$GREEN" "$MILLIS" "$RESET"
        fi
