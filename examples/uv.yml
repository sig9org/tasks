# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

silent: true

includes:
  _time: https://raw.githubusercontent.com/sig9org/tasks/main/tasks/_time.yml
  _uv: https://raw.githubusercontent.com/sig9org/tasks/main/tasks/_uv.yml

tasks:
  default:
    cmds:
      - task --list

  uv-freeze:
    aliases: [uf]
    deps: [_time:start]
    desc: "Export installed packages"
    cmds:
      - task: _uv:freeze
      - defer: { task: _time:end }

  uv-sync:
    aliases: [us]
    deps: [_time:start]
    desc: "Sync dependencies and upgrade all packages"
    cmds:
      - task: _uv:sync
      - defer: { task: _time:end }
