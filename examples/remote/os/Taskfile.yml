# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: ['.env']

silent: true

includes:
  _task: https://raw.githubusercontent.com/sig9org/tasks/main/tasks/_all.yml

tasks:
  default:
    cmds:
      - task --list

  cleanup:
    aliases: [c]
    desc: "Cleanup unnecessary files"
    cmds:
      - defer:
          task: _task:_time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _task:_cleanup:start

  os-check-update:
    aliases: [oc]
    desc: "Check for available OS package updates"
    cmds:
      - defer:
          task: _task:_time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _os:check

  os-remove:
    aliases: [or]
    desc: "Remove unnecessary OS packages and dependencies"
    cmds:
      - defer:
          task: _task:_time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _os:remove

  os-update:
    aliases: [ou]
    desc: "Update and upgrade OS packages"
    cmds:
      - defer:
          task: _task:_time:end
          vars:
            START_TIME: '{{.START_TIME}}'
      - task: _os:update
